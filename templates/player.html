<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} - MK Stream</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
* {box-sizing: border-box; margin:0; padding:0}
body{background:#050505;color:#fff;font-family:'Poppins',sans-serif;padding:0;margin:0;}
.container{max-width:1100px;margin:20px auto;padding:15px;}

.header{text-align:center;margin-bottom:20px;}
.header h1{color:#00e676;font-weight:800;font-size:24px;}
.header p{color:#888;font-size:13px;}

.video-wrap{background:#111;border-radius:12px;border:1px solid #222;overflow:hidden;box-shadow:0 0 25px rgba(0,230,118,0.1);}
#video{width:100%;background:#000;aspect-ratio:16/9;}

.controls{background:#0a0a0a;padding:15px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;border-top:1px solid #222;}
.control-group{display:flex;gap:8px;align-items:center;}
.control-group label{font-size:12px;color:#aaa;font-weight:600;}

select,button{padding:10px 16px;background:#222;border:1px solid #333;color:#fff;border-radius:8px;font-weight:600;cursor:pointer;font-family:'Poppins';transition:0.2s;}
select:hover,button:hover{background:#2a2a2a;}
select:focus{outline:none;border-color:#00e676;}

.btn-download{background:#FF0000!important;border-color:#FF0000!important;}
.btn-download:hover{background:#cc0000!important;}
.btn-prev{background:#00e676;color:#000!important;}
.btn-next{background:#00e676;color:#000!important;}

.info{padding:15px;background:#0a0a0a;text-align:center;font-size:12px;color:#888;}
.warning{color:#ffaa00;}

@media(max-width:600px){
  .controls{flex-direction:column;}
  .control-group{width:100%;justify-content:space-between;}
  select,button{width:100%;}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🔥 {{title}}</h1>
    <p>Powered by MK Channel Streamer</p>
  </div>

  <div class="video-wrap">
    <video id="video" controls autoplay playsinline></video>
    
    <div class="controls">
      <div class="control-group">
        <label>🎵 Audio:</label>
        <select id="audioSelect">
          <option>Loading tracks...</option>
        </select>
      </div>

      <div class="control-group">
        <label>⚡ Quality:</label>
        <select id="qualitySelect">
          <option>Auto</option>
        </select>
      </div>

      <button class="btn-prev" onclick="skip(-10)">⏪ -10s</button>
      <button class="btn-next" onclick="skip(10)">+10s ⏩</button>
      <button class="btn-download" onclick="downloadVideo()">⬇ Download</button>
    </div>

    <div class="info">
      <span class="warning">Note:</span> If audio tracks don't load, the video might only have 1 audio. 
      Download button = Original file from Telegram
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const audioSelect = document.getElementById('audioSelect');
const qualitySelect = document.getElementById('qualitySelect');
const DOWNLOAD_URL = "{{download_url}}";
let hls;

// HLS PLAYER SETUP
if(Hls.isSupported()) {
  hls = new Hls({
    enableWorker: true,
    lowLatencyMode: true
  });
  
  hls.loadSource("{{stream_url}}");
  hls.attachMedia(video);

  hls.on(Hls.Events.MANIFEST_PARSED, function() {
    // 1. FILL AUDIO TRACKS
    audioSelect.innerHTML = '';
    if(hls.audioTracks.length > 0){
      hls.audioTracks.forEach((track, i) => {
        let opt = document.createElement('option');
        opt.value = i;
        opt.innerText = track.name || track.lang || `Audio Track ${i+1}`;
        audioSelect.appendChild(opt);
      });
    } else {
      audioSelect.innerHTML = '<option>No extra audio tracks</option>';
    }

    // 2. FILL QUALITY LEVELS
    qualitySelect.innerHTML = '<option value="-1">Auto</option>';
    hls.levels.forEach((level, i) => {
      let opt = document.createElement('option');
      opt.value = i;
      opt.innerText = level.height + 'p';
      qualitySelect.appendChild(opt);
    });
  });

  hls.on(Hls.Events.ERROR, function(event, data) {
    if(data.fatal) {
      console.error('HLS Error:', data);
      alert('Error loading stream. Try refreshing.');
    }
  });

} else if(video.canPlayType('application/vnd.apple.mpegurl')) {
  // For Safari/iPhone
  video.src = "{{stream_url}}";
} else {
  alert('Your browser does not support HLS');
}

// CHANGE AUDIO TRACK
audioSelect.addEventListener('change', function() {
  if(hls) hls.audioTrack = parseInt(this.value);
});

// CHANGE QUALITY
qualitySelect.addEventListener('change', function() {
  if(hls) hls.currentLevel = parseInt(this.value);
});

// SKIP BUTTONS
function skip(seconds) {
  video.currentTime += seconds;
}

// DOWNLOAD BUTTON
function downloadVideo() {
  window.open(DOWNLOAD_URL, '_blank');
}

// SAVE RESUME POSITION
video.addEventListener('timeupdate', () => {
  localStorage.setItem('mk-resume-{{title}}', video.currentTime);
});
window.addEventListener('load', () => {
  let resume = localStorage.getItem('mk-resume-{{title}}');
  if(resume) video.currentTime = resume;
});
</script>

</body>
</html>
